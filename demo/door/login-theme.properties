# dvar's login theme properties, in place of Chowkidar's: the same parent, styles and scripts, less
# css/chowkidar-hide-v2.css. That sheet hides the password form from people, who sign in with an identity
# provider's button; the demo's realm has no identity provider, so its password form is the visitor's way in.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/chowkidar-v4.css css/chowkidar-bar-v1.css css/chowkidar-hide-v1.css
scripts=js/chowkidar-config.js js/chowkidar-bar-v6.js

# The reverse proxy: the one way into the demo, on 127.0.0.1:8443. Part of neenv: it holds TLS for every
# name, serves the shell, and is the only party that may tell a utility who is calling.
#
# THE RULE THAT MAKES A UTILITY'S IDENTITY HEADER TRUSTWORTHY: it is SET from a verified client certificate
# and CLEARED on every request without one, so a caller can never type it.
map $ssl_client_verify $client_identity {
    SUCCESS  $ssl_client_s_dn;
    default  "";
}

ssl_certificate      /certs/proxy.pem;
ssl_certificate_key  /certs/proxy.key;

# The door (Chowkidar), and the shell every house wears, served beside it.
server {
    listen 8443 ssl;
    server_name door.localhost;

    location /cdn/ {
        alias /shell/;
        add_header Access-Control-Allow-Origin *;
    }
    location / {
        proxy_set_header Host $host:8443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_pass http://door:8080;
    }
}

# The houses: each signs its people in at the door and keeps its own session.
server {
    listen 8443 ssl;
    server_name house-python.localhost;
    location / {
        proxy_set_header Host $host:8443;
        proxy_pass http://house-python:8000;
    }
}
server {
    listen 8443 ssl;
    server_name house-node.localhost;
    location / {
        proxy_set_header Host $host:8443;
        proxy_pass http://house-node:8000;
    }
}

# The utilities: a house reaches each with its OWN client certificate, never with a person's pass.
server {
    listen 8443 ssl;
    server_name bhandara.localhost;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client optional;
    client_max_body_size 30m;
    location / {
        proxy_set_header X-Client-Identity $client_identity;
        proxy_set_header Host $host;
        proxy_pass http://bhandara:8100;
    }
}
server {
    listen 8443 ssl;
    server_name dakiya.localhost;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client optional;
    location / {
        proxy_set_header X-Client-Identity $client_identity;
        proxy_set_header Host $host;
        proxy_pass http://unix:/sock/dakiya.sock;
    }
}

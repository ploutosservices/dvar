# dvar on your machine, in one command: a small neenv (a throwaway CA, a reverse proxy, PostgreSQL, an S3
# store, a mail sink), the door (Keycloak with Chowkidar), two houses (Python and Node) wearing one bar, and
# the utilities bhandara (files) and dakiya (mail). Nothing here is a production setting.
#
#   cp .env.example .env              then replace every CHANGEME in it
#   docker compose up --build -d      then open https://house-python.localhost:8443/ (trust certs/ca.pem, or accept the warning)
#   docker compose run --build --rm tests      the end-to-end test; docker compose down -v when done
#
# Chowkidar, bhandara and dakiya are built from their own public repositories; point *_CONTEXT at a local
# checkout to build from that instead.
name: dvar-demo

x-house: &house
  environment: &house-env
    DOOR_ISSUER: https://door.localhost:8443/realms/demo
    SHELL_URL: https://door.localhost:8443/cdn
    HOUSE_ENVIRONMENT: demo
    HOUSE_ENV_COLOUR: "#134e4a"
    HOUSE_TENANT: Acme
    BHANDARA_URL: https://bhandara.localhost:8443
    DAKIYA_URL: https://dakiya.localhost:8443
    DEMO_CA: /certs/ca.pem
    HOUSE_WEATHER: ${HOUSE_WEATHER:-off}   # the weather slot is opt-in: "on" shows it (see NOTICE)
  volumes:
    - certs:/certs:ro
  depends_on:
    certs: { condition: service_completed_successfully }

services:
  # ── neenv in miniature ──
  # first: refuse a CHANGEME left in .env or a missing shell, then make the demo's CA and certificates
  certs:
    build: { context: ., dockerfile: demo/tools/Dockerfile }
    command: ["sh", "-c", "python demo/preflight.py && python demo/make-certs.py /certs"]
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env}
      DEMO_PERSON_PASSWORD: ${DEMO_PERSON_PASSWORD:?set it in .env}
      HOUSE_PYTHON_CLIENT_SECRET: ${HOUSE_PYTHON_CLIENT_SECRET:?set it in .env}
      HOUSE_NODE_CLIENT_SECRET: ${HOUSE_NODE_CLIENT_SECRET:?set it in .env}
    volumes:
      - certs:/certs
      - &shell { type: bind, source: ./shell, target: /shell, read_only: true, bind: { create_host_path: false } }

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - *shell     # shell/ ships in the published tree; compose refuses to start without it
      - certs:/certs:ro
      - sock:/sock
    ports:
      - "127.0.0.1:8443:8443"
    networks:
      default:
        # inside the demo, every name is the proxy, as *.localhost is 127.0.0.1 in a browser
        aliases: [door.localhost, house-python.localhost, house-node.localhost, bhandara.localhost, dakiya.localhost]
    depends_on:   # nginx resolves every upstream when it starts
      certs: { condition: service_completed_successfully }
      door: { condition: service_started }
      house-python: { condition: service_started }
      house-node: { condition: service_started }
      bhandara: { condition: service_started }
      dakiya: { condition: service_started }

  # ── the door ──
  door:
    build:
      context: .
      dockerfile: demo/door/Dockerfile
      additional_contexts:
        chowkidar: ${CHOWKIDAR_CONTEXT:-https://github.com/ploutosservices/chowkidar.git}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set it in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env}
      HOUSE_PYTHON_CLIENT_SECRET: ${HOUSE_PYTHON_CLIENT_SECRET:?set it in .env}
      HOUSE_NODE_CLIENT_SECRET: ${HOUSE_NODE_CLIENT_SECRET:?set it in .env}
      KC_HOSTNAME: https://door.localhost:8443
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_TRUSTSTORE_PATHS: /certs/ca.pem      # the door calls each house's back-channel logout over TLS
    volumes:
      - certs:/certs:ro
    depends_on:
      certs: { condition: service_completed_successfully }

  # ── the houses ──
  house-python:
    <<: *house
    build: houses/python
    environment:
      <<: *house-env
      HOUSE_CLIENT_ID: house-python
      HOUSE_DISPLAY_NAME: Python house
      HOUSE_BASE_URL: https://house-python.localhost:8443
      HOUSE_CLIENT_SECRET: ${HOUSE_PYTHON_CLIENT_SECRET:?set it in .env}
      HOUSE_CERT: /certs/house-python@demo.pem
      HOUSE_KEY: /certs/house-python@demo.key
      HOUSE_OTHERS: '[{"name": "Node house", "url": "https://house-node.localhost:8443"}]'

  house-node:
    <<: *house
    build: houses/node
    environment:
      <<: *house-env
      HOUSE_CLIENT_ID: house-node
      HOUSE_DISPLAY_NAME: Node house
      HOUSE_BASE_URL: https://house-node.localhost:8443
      HOUSE_CLIENT_SECRET: ${HOUSE_NODE_CLIENT_SECRET:?set it in .env}
      HOUSE_CERT: /certs/house-node@demo.pem
      HOUSE_KEY: /certs/house-node@demo.key
      HOUSE_OTHERS: '[{"name": "Python house", "url": "https://house-python.localhost:8443"}]'

  # ── bhandara: files, with its PostgreSQL and an S3 store ──
  bhandara-db:
    build:
      context: ${BHANDARA_CONTEXT:-https://github.com/ploutosservices/bhandara.git}
      dockerfile_inline: |
        FROM postgres:16.4-alpine
        COPY schema.sql /docker-entrypoint-initdb.d/schema.sql
    environment:
      POSTGRES_DB: storage
      POSTGRES_USER: storage
      POSTGRES_HOST_AUTH_METHOD: trust     # demo only: no password on a throwaway network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "storage", "-d", "storage"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:3.80       # any S3-compatible store; this one accepts any key
    command: server -dir=/data -s3 -s3.port=8333

  bhandara:
    build:
      context: ${BHANDARA_CONTEXT:-https://github.com/ploutosservices/bhandara.git}
      target: app
    environment:
      STORAGE_DB_DSN: host=bhandara-db dbname=storage user=storage
      MINIO_URL: http://s3:8333
      # the demo's store accepts any key; a real S3 store's access key and secret go here
      MINIO_ACCESS_KEY: "<any>"
      MINIO_SECRET_KEY: "<any>"
      MINIO_BUCKET: storage
    depends_on:
      bhandara-db: { condition: service_healthy }
      s3: { condition: service_started }

  # ── dakiya: mail, with its PostgreSQL and a sink that delivers nothing ──
  dakiya-db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: mailsend
      POSTGRES_USER: mailsend
      POSTGRES_HOST_AUTH_METHOD: trust     # demo only
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mailsend", "-d", "mailsend"]
      interval: 2s
      retries: 30

  smtp:
    image: axllent/mailpit:v1.20.4
    environment:
      MP_SMTP_TLS_CERT: /certs/smtp.pem
      MP_SMTP_TLS_KEY: /certs/smtp.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    volumes:
      - certs:/certs:ro
    ports:
      - "127.0.0.1:8025:8025"     # every mail the demo sends, caught, in a browser
    depends_on:
      certs: { condition: service_completed_successfully }

  dakiya:
    build: ${DAKIYA_CONTEXT:-https://github.com/ploutosservices/dakiya.git}
    # its schema first, then the service on a socket only the proxy shares
    entrypoint: ["sh", "-c", "venv/bin/python -m mailsend.schema_migrate --apply && umask 000 && exec ./run.sh"]
    environment:
      MAIL_SEND_DSN: host=dakiya-db dbname=mailsend user=mailsend
      MAIL_SEND_ENV: demo
      MAIL_SEND_UDS: /sock/dakiya.sock
      DEMO_SMTP_ADDRESS: smtp:1025
      DEMO_SMTP_CERT: /certs/dakiya.pem
      DEMO_SMTP_KEY: /certs/dakiya.key
      DEMO_SMTP_CA: /certs/ca.pem
    volumes:
      - sock:/sock
      - certs:/certs:ro
    depends_on:
      dakiya-db: { condition: service_healthy }
      smtp: { condition: service_started }

  # ── what an operator writes once: the demo person, dakiya's grants, bhandara's bucket ──
  seed:
    build: { context: ., dockerfile: demo/tools/Dockerfile }
    command: ["python", "demo/seed.py"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set it in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set it in .env}
      DEMO_PERSON_PASSWORD: ${DEMO_PERSON_PASSWORD:?set it in .env}
      MAIL_SEND_DSN: host=dakiya-db dbname=mailsend user=mailsend
      MINIO_BUCKET: storage
    depends_on:
      door: { condition: service_started }
      dakiya: { condition: service_started }
      s3: { condition: service_started }

  tests:
    build: { context: ., dockerfile: demo/tools/Dockerfile }
    command: ["python", "tests/e2e.py"]
    environment:
      DEMO_CA: /certs/ca.pem
      SINK_URL: http://smtp:8025
      DEMO_PERSON_PASSWORD: ${DEMO_PERSON_PASSWORD:?set it in .env}
    volumes:
      - certs:/certs:ro
    depends_on:
      seed: { condition: service_completed_successfully }
      proxy: { condition: service_started }
      house-python: { condition: service_started }
      house-node: { condition: service_started }
      bhandara: { condition: service_started }

volumes:
  certs:
  sock:
